name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: mvn -B -ntp verify
      - name: Build and start services
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: API and restart recovery smoke tests
        run: python3 scripts/smoke.py --recovery
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
